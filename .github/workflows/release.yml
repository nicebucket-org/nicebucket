# See https://github.com/tauri-apps/tauri-action for more information
name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "patch"
          - "minor"
          - "major"

jobs:
  create-version-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versioning.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App Token
        id: get_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.get_token.outputs.token }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run lint checks
        run: bun run lint

      - name: Run formatting checks
        run: bun run format:check

      - name: Run tests
        run: bun run test

      - name: Install Tauri dependencies (Ubuntu)
        run: |
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Create version tag
        id: versioning
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Error: You must be on the main branch to create a version tag. Current branch: $GITHUB_REF_NAME"
            exit 1
          fi

          git config --global user.name "nicebucket-release-bot[bot]"
          git config --global user.email "2131833+nicebucket-release-bot[bot]@users.noreply.github.com"

          echo "Creating version tag from main branch..."

          RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          if [ "$RELEASE_TYPE" = "auto" ] || [ -z "$RELEASE_TYPE" ]; then
            echo "Using automatic version detection..."
            bun run standard-version
          else
            echo "Using specified release type: $RELEASE_TYPE"
            bun run standard-version --release-as $RELEASE_TYPE
          fi

          NEW_VERSION=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update tauri.conf.json version (looking for "version" field near top of file)
          sed -i '0,/^  "version":/{s/^  "version": ".*"/  "version": "'$NEW_VERSION'"/;}' src-tauri/tauri.conf.json

          # Update Cargo.toml version (only in the [package] section)
          sed -i '/^\[package\]$/,/^\[.*\]$/{s/^version = ".*"/version = "'$NEW_VERSION'"/;}' src-tauri/Cargo.toml

          # Update Cargo.lock to reflect the version change (only for nicebucket package)
          sed -i '/^name = "nicebucket"$/,/^$/{s/^version = ".*"/version = "'$NEW_VERSION'"/;}' src-tauri/Cargo.lock

          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit --amend --no-edit

          # Update the tag to point to the amended commit
          git tag -d v$NEW_VERSION
          git tag v$NEW_VERSION

          # Pull any changes that might have been pushed during release creation
          git pull --rebase origin main
          git push origin HEAD
          git push origin v$NEW_VERSION --force

  publish-tauri:
    needs: create-version-tag
    env:
      APP_VERSION: ${{ needs.create-version-tag.outputs.version }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.create-version-tag.outputs.version }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Verify version files
        shell: bash
        run: |
          echo "Expected version: ${{ needs.create-version-tag.outputs.version }}"
          echo "package.json version: $(python -c "import json; print(json.load(open('package.json'))['version'])")"
          echo "tauri.conf.json version: $(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          echo "Cargo.toml version: $(python -c "import tomllib; print(tomllib.load(open('src-tauri/Cargo.toml', 'rb'))['package']['version'])")"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Clean and install frontend dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          if (Test-Path "node_modules") { Remove-Item -Recurse -Force "node_modules" }
          bun install --frozen-lockfile
        shell: pwsh

      - name: Clean and install frontend dependencies (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        timeout-minutes: 360
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.APP_VERSION }}
          releaseName: "v${{ env.APP_VERSION }}"
          releaseBody: "See the assets to download this version and install.\n\n**macOS users:** This app is not signed or notarized. After copying it to Applications, run: `xattr -cr /Applications/nicebucket.app`\n\n**Wayland users:** On some non-Debian distros, launch with `LD_PRELOAD=/usr/lib/libwayland-client.so GDK_SCALE=1 ./nicebucket.AppImage`."
          releaseDraft: false
          prerelease: false
          appVersion: ${{ env.APP_VERSION }}
          args: ${{ matrix.args }}
